<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rocket Simulation</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="container">
    <div id="simulation">
      <!-- Aquí se monta Three.js -->
      <canvas id="three-canvas"></canvas>
      <!-- Barra de altura -->
      <div id="altitude-bar-container">
        <div id="altitude-bar">
          <div id="altitude-bar-fill"></div>
        </div>
        <div id="altitude-label">0 m</div>
      </div>
    </div>
    <div id="interface">
      <div id="charts">
        <!-- Aquí puedes colocar gráficos, datos, etc. -->
        <canvas id="speedChart"></canvas>
        <canvas id="accelerationChart"></canvas>
        <canvas id="altitudeChart"></canvas>
        <canvas id="rotationChart"></canvas>
      </div>
    </div>
  </div>
  <!-- Carga Chart.js como script global UMD antes de tus módulos -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js",
    "three/examples/jsm/loaders/GLTFLoader.js": "https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/loaders/GLTFLoader.js",
    "three/examples/jsm/controls/OrbitControls.js": "https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/controls/OrbitControls.js"
  }
}
</script>
  <script type="module" src="./src/main.js"></script>
 <!--<script type="module" src="./src/graphs/main.js"></script>-->

</body>
</html>
